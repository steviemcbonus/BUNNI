<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUNNI: Freya's Personal Hashimoto Tracker!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen p-4 text-slate-800 bg-repeat bg-fixed" style="background-image: url('https://png.pngtree.com/thumb_back/fh260/background/20210302/pngtree-cute-bunny-pink-background-illustration-image_572930.jpg');">

  <main class="max-w-md mx-auto bg-white/95 backdrop-blur-md rounded-2xl shadow-lg border border-slate-200 overflow-hidden">

    <header class="p-4 bg-indigo-600 text-white text-center">
      <h1 class="text-xl font-bold">Welcome back, Bunny!</h1>
    </header>

    <section class="p-6 space-y-4">
      <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">How are you feeling today? (1-10)</h2>
      
      <!-- 1. Fatigue Slider -->
      <div>
        <div class="flex justify-between text-sm font-medium mb-1">
          <label for="fatigue">Fatigue</label>
          <span id="fatigueVal" class="font-bold text-indigo-600">1</span>
        </div>
        <input type="range" id="fatigue" min="1" max="10" value="1" class="w-full accent-indigo-600">
      </div>

      <!-- 2. Brain Fog Slider -->
      <div>
        <div class="flex justify-between text-sm font-medium mb-1">
          <label for="brainFog">Brain Fog</label>
          <span id="fogVal" class="font-bold text-indigo-600">1</span>
        </div>
        <input type="range" id="brainFog" min="1" max="10" value="1" class="w-full accent-indigo-600">
      </div>

      <!-- 3. Joint / Muscle Aches -->
      <div>
        <div class="flex justify-between text-sm font-medium mb-1">
          <label for="jointPain">Sleep Quality</label>
          <span id="jointVal" class="font-bold text-indigo-600">1</span>
        </div>
        <input type="range" id="jointPain" min="1" max="10" value="1" class="w-full accent-indigo-600">
      </div>

     

      <!-- 5. Mood / Anxiety -->
      <div>
        <div class="flex justify-between text-sm font-medium mb-1">
          <label for="anxiety">Mood</label>
          <span id="anxietyVal" class="font-bold text-indigo-600">1</span>
        </div>
        <input type="range" id="anxiety" min="1" max="10" value="1" class="w-full accent-indigo-600">
      </div>

      <!-- 6. Tummy -->
      <div>
        <div class="flex justify-between text-sm font-medium mb-1">
          <label for="bloating">Tummy</label>
          <span id="bloatingVal" class="font-bold text-indigo-600">1</span>
        </div>
        <input type="range" id="bloating" min="1" max="10" value="1" class="w-full accent-indigo-600">
      </div>

      <!-- Checkboxes Section -->
      <div class="pt-2 border-t border-slate-100 space-y-2">
        <div class="flex items-center justify-between">
          <label for="levo" class="text-sm font-medium">Taken your levothyroxine?</label>
          <input type="checkbox" id="levo" class="h-5 w-5 accent-indigo-600 rounded">
        </div>
        <div class="flex items-center justify-between">
          <label for="supplements" class="text-sm font-medium">Taken your supplements?</label>
          <input type="checkbox" id="supplements" class="h-5 w-5 accent-indigo-600 rounded">
        </div>
      </div>

      <!-- Notes Field -->
      <div>
        <label for="notes" class="block text-sm font-medium mb-1">Any other symptoms or notes?</label>
        <textarea id="notes" rows="2" class="w-full border rounded-lg p-2 text-sm bg-white" placeholder="e.g. Ate gluten, joints hurt, ass too juicy.."></textarea>
      </div>

      <button id="saveBtn" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition">
        Save Entry
      </button>
    </section>

    <!-- CHART & HISTORY SECTION -->
    <section class="p-6 border-t border-slate-100 space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Symptom Trends</h2>
        
        <div class="flex items-center space-x-1">
          <!-- Timeframe Filters (7D default, 14D, 28D) -->
          <div id="timeFilters" class="flex bg-slate-100 p-0.5 rounded-lg text-xs font-semibold text-slate-600">
            <button data-days="7" class="filter-btn px-2.5 py-1 rounded-md bg-white shadow-sm text-indigo-600 transition">7D</button>
            <button data-days="14" class="filter-btn px-2.5 py-1 rounded-md transition">14D</button>
            <button data-days="28" class="filter-btn px-2.5 py-1 rounded-md transition">28D</button>
          </div>

          <!-- Fullscreen Toggle -->
          <button id="fullscreenBtn" title="Full Screen" class="text-xs text-indigo-600 font-semibold hover:underline bg-indigo-50 px-2 py-1 rounded-md flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
          </button>
        </div>
      </div>
      
      <!-- Interactive Chart Canvas -->
      <div id="chartContainer" class="relative w-full h-96 bg-white p-2 rounded-xl border border-slate-100">
        <canvas id="trendChart"></canvas>
      </div>
      
      <!-- History List & CSV Export -->
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Recent Entries</h3>
          <button id="exportBtn" class="text-xs text-indigo-600 font-semibold hover:underline bg-indigo-50 px-2 py-1 rounded-md">
            Export CSV
          </button>
        </div>
        <div id="logHistory" class="space-y-2 max-h-48 overflow-y-auto pt-1 text-xs">
          <!-- Logs render here -->
        </div>
      </div>
    </section>

  </main>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // 1. DOM References for Sliders
    const sliders = [
      { input: 'fatigue', val: 'fatigueVal' },
      { input: 'brainFog', val: 'fogVal' },
      { input: 'jointPain', val: 'jointVal' },
      { input: 'anxiety', val: 'anxietyVal' },
      { input: 'bloating', val: 'bloatingVal' }
    ];

    sliders.forEach(s => {
      const el = document.getElementById(s.input);
      const display = document.getElementById(s.val);
      el.oninput = () => display.textContent = el.value;
    });

    const levoInput = document.getElementById('levo');
    const suppsInput = document.getElementById('supplements');
    const notesInput = document.getElementById('notes');
    const saveBtn = document.getElementById('saveBtn');
    const logHistory = document.getElementById('logHistory');
    const exportBtn = document.getElementById('exportBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const chartContainer = document.getElementById('chartContainer');

    // Default timeframe set to 7 days
    let selectedDays = 7;
    let logs = JSON.parse(localStorage.getItem('my_hashimoto_logs')) || [];

    // 2. Initialize Chart.js
    const ctx = document.getElementById('trendChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Fatigue', data: [], borderColor: '#6366f1', backgroundColor: '#6366f1', tension: 0.3 },
          { label: 'Brain Fog', data: [], borderColor: '#ec4899', backgroundColor: '#ec4899', tension: 0.3 },
          { label: 'Sleep', data: [], borderColor: '#eab308', backgroundColor: '#eab308', tension: 0.3 },
          { label: 'Mood', data: [], borderColor: '#8b5cf6', backgroundColor: '#8b5cf6', tension: 0.3 },
          { label: 'Tummy', data: [], borderColor: '#10b981', backgroundColor: '#10b981', tension: 0.3 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: 'bottom',
            labels: { boxWidth: 12, padding: 8, font: { size: 10 } }
          }
        },
        scales: {
          y: { min: 1, max: 10 }
        }
      }
    });

    // 3. Time Filter Click Handlers
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
        });
        e.target.classList.add('bg-white', 'shadow-sm', 'text-indigo-600');

        selectedDays = Number(e.target.getAttribute('data-days'));
        updateUI();
      };
    });

    // 4. Update UI Function
    function updateUI() {
      // Calculate cutoff date normalized to 00:00:00
      const cutoffDate = new Date();
      cutoffDate.setDate(cutoffDate.getDate() - selectedDays);
      cutoffDate.setHours(0, 0, 0, 0);
      
      const filteredLogs = logs.filter(entry => {
        const entryDate = new Date(entry.id);
        entryDate.setHours(0, 0, 0, 0);
        return entryDate >= cutoffDate;
      });

      const orderedLogs = [...filteredLogs].reverse();

      chart.data.labels = orderedLogs.map(e => e.date);
      chart.data.datasets[0].data = orderedLogs.map(e => e.fatigue);
      chart.data.datasets[1].data = orderedLogs.map(e => e.brainFog);
      chart.data.datasets[2].data = orderedLogs.map(e => e.jointPain);
      chart.data.datasets[3].data = orderedLogs.map(e => e.anxiety);
      chart.data.datasets[4].data = orderedLogs.map(e => e.bloating);
      chart.update();

      logHistory.innerHTML = logs.map(e => `
        <div class="p-2 bg-slate-50/90 rounded border border-slate-100 flex justify-between items-start gap-2">
    <div class="flex-1">
      <div class="flex justify-between font-bold text-slate-700">
        <span>${e.date}</span>
        <span>Fatigue: ${e.fatigue} | Fog: ${e.brainFog} | Sleep: ${e.jointPain}</span>
      </div>
      <div class="text-[10px] text-slate-500 mt-0.5">
        Mood: ${e.anxiety} | Tummy: ${e.bloating} | Levo: ${(e.levo ?? e.meds) ? 'Yes' : 'No'} | Supplements: ${e.supplements ? 'Yes' : 'No'}
      </div>
      ${e.notes ? `<p class="text-slate-500 italic mt-1 text-xs font-normal">${e.notes}</p>` : ''}
    </div>
    <!-- Delete Button -->
    <button data-id="${e.id}" class="delete-btn text-slate-400 hover:text-red-500 p-1 text-sm font-bold">
      &times;
    </button>
  </div>
      `).join('');
    }

logHistory.onclick = (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;

      const entryId = Number(btn.getAttribute('data-id'));
      
      if (confirm('Are you sure you want to delete this entry?')) {
        logs = logs.filter(item => item.id !== entryId);
        localStorage.setItem('my_hashimoto_logs', JSON.stringify(logs));
        updateUI();
      }
    };

    // Reset Form Function
    function resetForm() {
      sliders.forEach(s => {
        const el = document.getElementById(s.input);
        const display = document.getElementById(s.val);
        el.value = 1;
        display.textContent = '1';
      });
      levoInput.checked = false;
      suppsInput.checked = false;
      notesInput.value = '';
    }

    // 5. Save Button Click Handler
    saveBtn.onclick = () => {
      const newEntry = {
        id: Date.now(),
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
        fatigue: Number(document.getElementById('fatigue').value),
        brainFog: Number(document.getElementById('brainFog').value),
        jointPain: Number(document.getElementById('jointPain').value),
        anxiety: Number(document.getElementById('anxiety').value),
        bloating: Number(document.getElementById('bloating').value),
        levo: levoInput.checked,
        supplements: suppsInput.checked,
        notes: notesInput.value
      };

      logs.unshift(newEntry);
      localStorage.setItem('my_hashimoto_logs', JSON.stringify(logs));
      resetForm();
      updateUI();
    };

    // 6. CSV Export Logic
    exportBtn.onclick = () => {
      if (logs.length === 0) {
        alert("No entries to export yet!");
        return;
      }

      const headers = ["Date", "Fatigue", "Brain Fog", "Sleep Quality", "Mood", "Tummy", "Levothyroxine", "Supplements", "Notes"];
      const rows = logs.map(e => [
        `"${e.date}"`, 
        e.fatigue, 
        e.brainFog, 
        e.jointPain, 
        e.anxiety, 
        e.bloating, 
        (e.levo ?? e.meds) ? "Yes" : "No", 
        e.supplements ? "Yes" : "No", 
        `"${(e.notes || '').replace(/"/g, '""')}"`
      ]);

      const csvContent = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      
      link.setAttribute("href", url);
      link.setAttribute("download", `hashimoto_logs_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    // 7. Fullscreen Logic
    fullscreenBtn.onclick = () => {
      if (!document.fullscreenElement) {
        if (chartContainer.requestFullscreen) chartContainer.requestFullscreen();
        else if (chartContainer.webkitRequestFullscreen) chartContainer.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        chartContainer.classList.remove('h-96');
        chartContainer.classList.add('h-full', 'w-full', 'flex', 'items-center', 'justify-center', 'p-6');
      } else {
        chartContainer.classList.remove('h-full', 'w-full', 'flex', 'items-center', 'justify-center', 'p-6');
        chartContainer.classList.add('h-96');
      }
      chart.resize();
    });

    // Run initial load
    updateUI();
  </script>
</body>
</html>
